<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Controle Rodoxisto - Excel 365</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--primary:#2b2b2b;--secondary:#d71920;--muted:#6b7280;--line:#d1d5db;--success:#15803d;--warn:#f59e0b;--blue:#1e40af;--soft:#fff1f2}
*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
body{margin:0;background:linear-gradient(135deg,#f3f4f6,#fff);color:#111827}
header{background:linear-gradient(135deg,#fff,#f6f6f6);padding:18px;border-bottom:5px solid var(--secondary);box-shadow:0 8px 22px rgba(17,24,39,.16);position:sticky;top:0;z-index:3}
.header-inner{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{height:62px;max-width:240px;object-fit:contain}
h1{font-size:21px;margin:0;color:#111827} p{margin:5px 0 0;color:#4b5563;font-size:13px}
.container{padding:16px;max-width:1180px;margin:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 20px rgba(15,23,42,.08);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{font-size:12px;font-weight:800;color:#334155;display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:11px;background:white;font-size:14px}
textarea{min-height:82px;resize:vertical}
.span2{grid-column:span 2} .span4{grid-column:span 4}
.title{font-size:17px;font-weight:900;color:var(--primary);margin:0 0 12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-1px);filter:brightness(.96)}
.btn-primary{background:var(--primary);color:white} .btn-red{background:var(--secondary);color:white} .btn-light{background:#e2e8f0;color:#0f172a} .btn-green{background:var(--success);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{padding:13px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.kpi b{font-size:24px;color:var(--secondary)} .kpi span{display:block;color:var(--muted);font-size:12px;font-weight:700}
.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}
.bar{height:100%;width:0%;background:linear-gradient(90deg,var(--secondary),var(--primary));transition:.2s}
.etapas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.etapa{border:1px solid var(--line);border-left:5px solid var(--secondary);border-radius:15px;padding:12px;background:linear-gradient(135deg,#fff,#f9fafb)}
.etapa-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.etapa-head strong{font-size:13px;line-height:1.2} .etapa textarea{min-height:54px;margin-top:7px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}
.pendente{background:#fee2e2;color:#991b1b} .andamento{background:#fef3c7;color:#92400e} .cliente{background:#dbeafe;color:#1e40af} .concluida{background:#dcfce7;color:#166534} .cancelada{background:#e5e7eb;color:#374151}
.toast{position:fixed;right:14px;bottom:14px;background:#111827;color:#fff;padding:12px 14px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);display:none;z-index:20}
small{color:var(--muted)}
@media(max-width:850px){.grid,.kpis,.etapas{grid-template-columns:1fr}.span2,.span4{grid-column:span 1}}
</style>
</head>

<div class="container">
  <div class="card">
    <div class="title">Dados do Processo</div>
    <div class="grid">
      <div><label>ID Processo</label><input id="idProcesso" placeholder="ALT-2026-001"></div>
      <div><label>Empresa</label><input id="empresa" placeholder="Rodoxisto Transportes Ltda"></div>
      <div><label>CNPJ</label><input id="cnpj" placeholder="00.000.000/0000-00"></div>
      <div><label>Responsável</label><input id="responsavel" placeholder="Responsável"></div>
      <div><label>Tipo de Alteração</label><select id="tipo"><option>Abertura de Empresa</option><option>Alteração Contratual</option><option>Abertura de Filial</option><option>Encerramento de Filial</option><option>Alteração de Endereço</option><option>Alteração de Capital</option><option>Alteração de Objeto Social</option><option>Entrada/Saída de Sócio</option><option>Credenciamento Operacional</option><option>Outros</option></select></div>
      <div><label>Prioridade</label><select id="prioridade"><option>Baixa</option><option>Média</option><option>Alta</option><option>Urgente</option></select></div>
      <div><label>Data de Abertura</label><input id="dataAbertura" type="date"></div>
      <div><label>Prazo Final</label><input id="prazo" type="date"></div>
      <div class="span4"><label>Definição do Escopo da Alteração / Observações Gerais</label><textarea id="escopo" placeholder="Descreva a alteração, empresas/unidades envolvidas, matriz/filiais impactadas e pontos de atenção."></textarea></div>
    </div>
    <div class="actions">
      <button class="btn-primary" onclick="gerarId()">Gerar ID</button>
      <button class="btn-red" onclick="salvarExcel()">Salvar no Excel</button>
      <button class="btn-light" onclick="limpar()">Limpar</button>
    </div>
  </div>
  <div class="card">
    <div class="title">Resumo</div>
    <div class="kpis">
      <div class="kpi"><span>Total de etapas</span><b id="totalEtapas">0</b></div>
      <div class="kpi"><span>Concluídas</span><b id="etapasConcluidas">0</b></div>
      <div class="kpi"><span>Pendentes/andamento</span><b id="etapasPendentes">0</b></div>
      <div class="kpi"><span>Progresso</span><b id="percentual">0%</b><div class="progress"><div id="bar" class="bar"></div></div></div>
    </div>
  </div>
  <div class="card">
    <div class="title">Etapas do Processo</div>
    <small>Marque o status de cada etapa e informe observações quando necessário.</small>
    <div id="listaEtapas" class="etapas" style="margin-top:12px"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const ETAPAS = ["Definição do Escopo da Alteração", "Viabilidade - Matriz", "Viabilidade - Filial 01", "Viabilidade - Filial 02", "Viabilidade - Filial 03", "Viabilidade - Filial 04", "Aluguel da Unidade", "Elaborar Contrato Social", "DBE", "Taxa", "Coletar Assinaturas", "Emissão de Certificado Digital E-CNPJ", "Emissão de Certificado Digital E-CPF", "Solicitar Inscrição Estadual", "Credenciamento emissão de CT-e", "Cadastro ANTT", "Inclusão veículo ANTT", "Cadastro NS Tecnologia", "Cadastro CIOT", "Cadastro VOP", "Cadastro Seguro", "Cadastro REC", "Conferência Final", "Processo Concluído"];
const STATUS = ["Pendente", "Em andamento", "Aguardando cliente", "Concluída", "Cancelada"];
let excelReady = false;
Office.onReady(() => { excelReady = true; inicializar(); });
setTimeout(() => { if(!document.getElementById('listaEtapas').children.length) inicializar(); }, 500);
function hoje(){ return new Date().toISOString().slice(0,10); }
function gerarId(){ const d=new Date(); document.getElementById('idProcesso').value='ALT-'+d.getFullYear()+'-'+String(Date.now()).slice(-5); if(!document.getElementById('dataAbertura').value) document.getElementById('dataAbertura').value=hoje(); }
function slug(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]/g,'_'); }
function badgeClass(st){ return st==='Concluída'?'concluida':st==='Em andamento'?'andamento':st==='Aguardando cliente'?'cliente':st==='Cancelada'?'cancelada':'pendente'; }
function inicializar(){
  if(!document.getElementById('dataAbertura').value) document.getElementById('dataAbertura').value=hoje();
  const box=document.getElementById('listaEtapas'); box.innerHTML='';
  ETAPAS.forEach((etapa,i)=>{
    const id=slug(etapa);
    const div=document.createElement('div'); div.className='etapa';
    div.innerHTML=`<div class="etapa-head"><input type="checkbox" id="chk_${id}" style="width:auto" onchange="toggleConcluida('${id}')"><strong>${i+1}. ${etapa}</strong></div>
      <label>Status</label><select id="st_${id}" onchange="atualizarResumo()">${STATUS.map(s=>`<option>${s}</option>`).join('')}</select>
      <label style="margin-top:7px">Data de Conclusão</label><input type="date" id="dt_${id}">
      <label style="margin-top:7px">Observação</label><textarea id="obs_${id}" placeholder="Observação da etapa"></textarea>`;
    box.appendChild(div);
  });
  atualizarResumo();
}
function toggleConcluida(id){ const chk=document.getElementById('chk_'+id); const st=document.getElementById('st_'+id); const dt=document.getElementById('dt_'+id); if(chk.checked){st.value='Concluída'; if(!dt.value) dt.value=hoje();} else {st.value='Pendente'; dt.value='';} atualizarResumo(); }
function atualizarResumo(){
  const total=ETAPAS.length; let conc=0;
  ETAPAS.forEach(e=>{ const id=slug(e); if(document.getElementById('st_'+id)?.value==='Concluída') conc++; });
  const pct=total?Math.round(conc/total*100):0;
  document.getElementById('totalEtapas').textContent=total;
  document.getElementById('etapasConcluidas').textContent=conc;
  document.getElementById('etapasPendentes').textContent=total-conc;
  document.getElementById('percentual').textContent=pct+'%';
  document.getElementById('bar').style.width=pct+'%';
}
function dadosProcesso(){
  const id=document.getElementById('idProcesso').value.trim();
  if(!id) throw new Error('Informe ou gere o ID do processo.');
  const etapas=ETAPAS.map(e=>{ const sid=slug(e); const st=document.getElementById('st_'+sid).value; return { etapa:e, status:st, dataConclusao:document.getElementById('dt_'+sid).value, observacao:document.getElementById('obs_'+sid).value }; });
  const conc=etapas.filter(x=>x.status==='Concluída').length; const pct=etapas.length?conc/etapas.length:0;
  const etapaAtual=(etapas.find(x=>x.status!=='Concluída')||{etapa:'Processo Concluído'}).etapa;
  const statusGeral=pct===1?'Concluída':etapas.some(x=>x.status==='Aguardando cliente')?'Aguardando cliente':etapas.some(x=>x.status==='Em andamento')?'Em andamento':'Pendente';
  return { id, empresa:document.getElementById('empresa').value, cnpj:document.getElementById('cnpj').value, tipo:document.getElementById('tipo').value, responsavel:document.getElementById('responsavel').value, prioridade:document.getElementById('prioridade').value, statusGeral, dataAbertura:document.getElementById('dataAbertura').value, prazo:document.getElementById('prazo').value, percentual:pct, etapaAtual, escopo:document.getElementById('escopo').value, etapas };
}
async function salvarExcel(){
  try{
    const p=dadosProcesso(); atualizarResumo();
    if(!excelReady || typeof Excel === 'undefined'){ salvarLocal(p); aviso('Excel não detectado. Dados salvos no navegador para teste.'); return; }
    await Excel.run(async (context)=>{
      const wb=context.workbook;
      const tProc=wb.tables.getItem('T_Processos');
      const tEt=wb.tables.getItem('T_Etapas');
      const tHist=wb.tables.getItem('T_Historico');
      tProc.rows.add(null, [[p.id,p.empresa,p.cnpj,p.tipo,p.responsavel,p.prioridade,p.statusGeral,p.dataAbertura,p.prazo,p.percentual,p.etapaAtual,p.escopo]]);
      const etapaRows=p.etapas.map(x=>[p.id,x.etapa,x.status,p.dataAbertura,x.dataConclusao,p.responsavel,x.observacao]);
      tEt.rows.add(null, etapaRows);
      tHist.rows.add(null, [[new Date().toLocaleString('pt-BR'),p.id,p.responsavel,'Processo salvo','Processo e etapas gravados pelo formulário HTML']]);
      await context.sync();
    });
    aviso('Processo salvo no Excel com sucesso.');
  }catch(e){ aviso(e.message || String(e)); }
}
function salvarLocal(p){ localStorage.setItem('ultimoProcessoRodoxisto', JSON.stringify(p)); }
function limpar(){ document.querySelectorAll('input,textarea').forEach(e=>{ if(e.type==='checkbox') e.checked=false; else e.value=''; }); document.querySelectorAll('select').forEach(e=>e.selectedIndex=0); inicializar(); }
function aviso(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',4200); }
</script>
</body>
</html>
